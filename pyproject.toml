[project]
name = "coding-mcp"
version = "0.1.0"
description = "Stdio MCP для документов, картинок и таблиц внутри MCP_USER_WORKDIR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pillow>=11",
    "pypdf>=5.1",
    "python-docx>=1.1.2",
    "xlrd>=2.0.1",
]

[project.scripts]
coding-mcp = "coding_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coding_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
